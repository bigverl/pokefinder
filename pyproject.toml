
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "pokefinder"
version = "0.4.0"
description = "Just a fun pokemon tool for pokerogue fans"
requires-python = ">=3.12"

dependencies = [
    "litestar[standard]>=2.18.0",
    "structlog>=25.5.0",
    "python-dotenv>=1.2.0",
    "pydantic-settings>=2.0.0",
    "sniffio>=1.3.0",
    "anyio>=4.0.0",
    "textual-serve>=1.1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
    "pyright>=1.1.0",
]

tui = [
    "textual>=6.6.0",
    "textual-dev>=1.8.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests using mocked data",
    "component: Service-level tests that use postgres testcontainers "
]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]